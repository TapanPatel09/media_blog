<div class="max-w-3xl mx-auto py-8">
    <div class="mb-8">
        <a href="#!/dashboard" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-gray-700 mb-4 transition-colors">
            <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">{{ isEditing ? 'Edit Blog' : 'Write a new blog' }}</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div ng-if="error" class="bg-red-50 border-l-4 border-red-400 p-4 mb-6 rounded-md text-red-700 text-sm">
            {{ error }}
        </div>

        <form ng-submit="submitForm()" class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text" id="title" ng-model="blog.title" required placeholder="Enter a descriptive title..."
                    class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 sm:text-base transition-shadow">
            </div>

            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Content</label>
                <textarea id="content" ng-model="blog.content" required rows="12" placeholder="Tell your story..."
                    class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 sm:text-base transition-shadow font-serif"></textarea>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit"
                    class="inline-flex items-center px-6 py-3 border border-transparent shadow-sm text-base font-medium rounded-lg text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all hover:shadow-md">
                    {{ isEditing ? 'Save Changes' : 'Publish Blog' }}
                </button>
            </div>
        </form>
    </div>
</div>
